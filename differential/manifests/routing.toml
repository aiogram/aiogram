# Routing kind (A-10). Schema: differential/README.md. First matching entry wins (keep case-specific
# entries above probe wildcards); unmatched cases are invariant.
# Cases are `<topology id>.<feed>.fsm-<on|off>.<event or group>` (benchmarks/corpus/routing/); probes are
# `trace`, `kwargs`, `threads`, `result` and, per topology, `used_update_types`.
# The 4.0 approved differences (README breaking changes) carry `when = "aiogram4"`, which keeps them inert in
# 3.x-vs-3.x runs. A record matches one entry only, so every routing comparator also applies the two global
# ones (D12 on `kwargs`, D34 on `threads`); the last two entries cover the cases no specific entry matches.

[[case]]
match = "routing.kwargs.event-from-user.*"
class = "approved"
decision = "D12"
assert = "event_context_only_kwargs"
when = "aiogram4"
note = "a handler asking for event_from_user by signature: a DI error or no value; E-21 narrows it (breaking change 11)"

[[case]]
match = "routing.middleware.outer.*"
class = "approved"
decision = "D111"
assert = "outer_middleware_skipped_without_handler"
when = "aiogram4"
note = "outer middlewares of routers with no matching handler are skipped (PD-19, breaking change 24); replace-router: routing on the original event is E-02's open decision"

[[case]]
match = "routing.rejector.*"
class = "approved"
decision = "BC13"
assert = "compiled_rejector_skips_handler"
when = "aiogram4"
note = "README breaking change 13: compiled rejectors skip a handler whose Command / F.x == lit is certainly false"

[[case]]
match = "routing.errors.*"
class = "approved"
decision = "D48"
assert = "errors_bubble_to_raising_router"
when = "aiogram4"
note = "errors bubble to the raising router, then parents; siblings no longer catch (breaking change 17)"

[[case]]
match = "routing.isolation.*"
class = "approved"
decision = "D28"
assert = "event_isolation_default"
when = "aiogram4"
note = "D28 / D110: event isolation on by default, release_isolation() escape hatch (breaking change 15)"

[[case]]
match = "routing.snapshot.*"
class = "approved"
decision = "D114"
assert = "routing_snapshot_per_runner"
when = "aiogram4"
note = "per-Runner immutable routing snapshot; feed_update without a Runner picks a change up on the next update (breaking change 4)"

[[case]]
match = "routing.*/threads"
class = "approved"
decision = "D34"
assert = "sync_filters_inline"
when = "aiogram4"
note = "sync filters run inline by default (breaking change 16)"

[[case]]
match = "routing.*/kwargs"
class = "approved"
decision = "D12"
assert = "event_context_only_kwargs"
when = "aiogram4"
note = "event_from_user / event_chat / event_thread_id no longer injected, only event_context (breaking change 11)"
