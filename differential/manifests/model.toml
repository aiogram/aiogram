# Model kind (A-08). Schema: differential/README.md. First matching entry wins (keep case-specific
# entries above probe wildcards); unmatched cases are invariant. Probes: differential/README.md
# (*Model kind*); access paths: model.access.toml.
# 4.0 approved differences (README breaking changes): `when = "aiogram4"` keeps them inert in 3.x-vs-3.x
# runs. `gate = true` follows the A-07 plan (D83-D87, D91-D95, D103, D106-D108, and R06 through D91):
# void if B-13 is a no-go.

# --- 3.x vs 3.x ---------------------------------------------------------------------------------

[[case]]
match = "model.update.deep-nesting/decode.dict"
class = "approved"
decision = "GHSA-hv98-r5fx-wc83"
assert = "nesting_limit_on_dict_path"
note = "3.33.0: model_validate rejects the 200-deep chain with a recursion error; 3.32.0 decoded it"

# --- 4.0 ------------------------------------------------------------------------------------------

[[case]]
match = "model.update.unknown-tag/*"
class = "new"
decision = "D10"
when = "aiogram4"
note = "10 Layer 2: an unknown ChatMember status decodes (3.x: ValidationError, union_tag_invalid)"

[[case]]
match = "model.update.unknown-enum/*"
class = "new"
decision = "D10"
when = "aiogram4"
note = "10 Layer 2: an unknown enum value decodes (3.x: ValidationError, literal_error)"

[[case]]
match = "model.update.unknown-type/event"
class = "new"
decision = "D10"
when = "aiogram4"
note = "10 Layer 2: an unknown update type has an event type (3.x: UpdateTypeLookupError)"

[[case]]
match = "model.update.malformed-member/*"
class = "new"
decision = "D107"
gate = true
when = "aiogram4"
note = "a malformed union member becomes Unknown with .decode_error, the update decodes (breaking change 3/9)"

[[case]]
match = "model.codex11.eq_across_bots/observe"
class = "approved"
decision = "D108"
assert = "equality_ignores_bot"
gate = true
when = "aiogram4"
note = "codex section 11: equality across bots is false in 3.x"

[[case]]
match = "model.*/eq.other_bot"
class = "approved"
decision = "D108"
assert = "equality_ignores_bot"
gate = true
when = "aiogram4"
