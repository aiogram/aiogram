decision = "D86"
assert = "wire_names_in_dump_json"
gate = true
when = "aiogram4"
note = "D86 / D94: model_dump_json() is to_json() as str, wire names (breaking change 18)"

[[case]]
match = "model.construct.User/extra.non_json"
