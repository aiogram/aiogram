[[case]]
match = "model.*/hash.event"
class = "approved"
decision = "D108"
assert = "hashable_when_fields_are"
gate = true
when = "aiogram4"
note = "D108 / D106: hashable when all fields are; tuples make list-field objects hashable (breaking change 23)"

[[case]]
match = "model.update.*/dump_json.default"
