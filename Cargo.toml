[workspace]
resolver = "3"
members = ["crates/aiogram-core"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/aiogram/aiogram/"

[workspace.dependencies]
# pyo3 >=0.30: older versions lock the reference-pool mutex on every call once a `Py` is
# dropped while detached (v4/research/13 B6)
pyo3 = "0.30.1"
# `python`: PythonParse for values handed to Python converters (F-08 converters)
jiter = { version = "=0.19.0", default-features = false, features = ["python"] }

[workspace.lints.clippy]
# v4/research/13 B11: also enforced in generated code, `allow(clippy::all)` does not mask them
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
# thin LTO + 16 units; fat LTO tripled build time for ~2% (v4/research/13 B4)
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
