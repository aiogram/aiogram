# aiogram migration registry (PD-13): the single source for the 3.x baseline warnings, the 4.0
# `aiogram migrate` checker and codemod, and the migration guide / Deprecations page.
# It is plain data read by path (tomllib); nothing here may require importing aiogram.
# tests/test_migration_registry.py enforces every rule below.
#
# Schema 1. One [[entry]] per item, entries sorted by id. Every key is required unless marked optional.
#   id              "AG4nnn". Append-only: never reused, renumbered or deleted. Docs anchor: id.lower().
#   kind            removal-4.0 | deprecation-4.x | api-ledger
#   title           short statement of the change; also the warning text, so it reads after "AG4nnn: "
#   decisions       non-empty list of Dnnn / PD-nn / Rnn ids
#   area            migration-guide page (18 §2): types, dispatcher, filters, middlewares, fsm, errors,
#                   client, utils, i18n, packaging
#   change          removed | behaviour | signature | renamed
#   replacement     what user code does instead
#   detection       checker finding class (R28): definite | heuristic | manual
#   confidence      high | medium | low
#   codemod         full | partial | none
#   suppress        checker suppression comment, always "aiogram: ignore[<id>]"
#   gate            true when the item depends on the B spike gate (D104)
#   breaking_change optional: README "Breaking changes in 4.0" number (1-24)
#   generated       true exactly for api-ledger entries, which a generator writes (3x-23)
#   fields          api-ledger only: removed field names of the object / method (empty for a removed entity)
#   warn_3x         3.x baseline warning (3x-20..23):
#     site          import | attribute | construction | registration | class-creation | mutation | call | read | none
#     target        dotted name where the warning hooks in: the module (import), module attribute(s)
#                   (attribute, comma-separated when one entry covers several names), class (construction,
#                   class-creation, mutation, registration), attribute (read) or callable (call); "" for none
#     since         baseline 3.x version, filled by 3x-24; "" until then
#   removal         deprecation-4.x only (D71): deprecated_in, earliest_removal (version floor; the later of
#                   12 months and 2 minors after deprecated_in, the 12-month part is checked by I-12)
#
# Id blocks (PD-33):
#   AG4001-AG4699  removal-4.0 / deprecation-4.x, allocated on dev-4.x by 4.0 plans. AG4001-AG4049 are the
#                  A-11 seed, written on dev-3.x once and merged forward.
#   AG4700-AG4799  removal-4.0 / deprecation-4.x entries first added on dev-3.x (3x-20..23), so the two
#                  branches never collide.
#   AG4800-AG4999  api-ledger, one per affected Bot API object or method plus one per removed entity (3x-23).
#
# Authority and sync (PD-33):
#   1. Before the dev-4.x fork the file lives on dev-3.x.
#   2. After the fork dev-4.x is authoritative. dev-3.x changes reach it by the normal merge-forward, which
#      only appends in the AG47xx and AG48xx blocks or fills warn_3x.since.
#   3. Before each baseline-bearing 3.x release, 3x-24 copies dev-4.x's file to dev-3.x.
#   4. The test on both branches checks parsing, unique ids, blocks, and that ids are append-only against
#      the previous release tag.

schema = 1

# 3.x warning text; the docs link "See <docs url>#<anchor>" is appended by 3x-20.
message = "{id}: {title}; use {replacement}. Removed in aiogram 4.0."

