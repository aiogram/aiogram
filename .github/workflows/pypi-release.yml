name: Deploy

on:
  push:
    tags:
      - "v3.*"

permissions: {}

concurrency:
  # never cancel a release in flight
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package-version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          # release artifacts must not come from a shared cache
          enable-cache: false

      - name: Resolve version from tag
        id: package-version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        # unpinned, twine's own linter could start rejecting valid metadata on an upstream
        # change and block a release; bump this constraint deliberately
        run: uvx --from 'twine~=7.0' twine check --strict dist/*

      - name: Smoke-test wheel and sdist
        env:
          VERSION: ${{ steps.package-version.outputs.value }}
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            # a venv inside the checkout would be swept into the next sdist (hatchling packs
            # it and its absolute symlinks break the build), so it lives under RUNNER_TEMP instead
            venv="${RUNNER_TEMP}/smoke"
            uv venv --clear "$venv"
            uv pip install --python "$venv/bin/python" "$dist"
            # -P keeps the checkout's own aiogram/ off sys.path, so this imports what was just installed
            installed="$("$venv/bin/python" -P -c "import aiogram; print(aiogram.__version__)")"
            echo "${dist}: installed aiogram ${installed}"
            [[ "${installed}" == "${VERSION}" ]]
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aiogram/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC) to PyPI; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
