name: Benchmarks

# Non-blocking: never runs on pull requests. Thresholds live in the plans, not here.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Run (Linux, uvloop)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Install project
        run: uv sync --locked --all-extras --no-extra docs

      - name: Run all cases
        run: make bench args="--out benchmarks/results/ci-linux.json"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks-linux
          path: benchmarks/results/ci-linux.json
          if-no-files-found: error
