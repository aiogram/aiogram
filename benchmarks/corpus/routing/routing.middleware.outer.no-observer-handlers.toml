# D111 / PD-19: an outer middleware on a router that has no handler for the event type at all.
schema = 1
bench = false  # an oracle scenario (A-10), not a bench topology

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"
outer_middlewares = [{ id = "r1.m0", event = "message", kind = "pass" }]

[[router.handler]]
id = "h1"
event = "callback_query"
filters = []

[[router]]
name = "r2"
parent = "dp"

[[router.handler]]
id = "h2"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "h2"
