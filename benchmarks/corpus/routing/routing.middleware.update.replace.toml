# A dp.update outer middleware replaces the Update (message text "hello" -> "/c1"). E-02 decides
# whether 4.0 routing keys follow it (the proposed default: yes).
schema = 1
bench = false  # an oracle scenario (A-10), not a bench topology

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"
outer_middlewares = [{ id = "dp.m0", event = "update", kind = "replace", patch = { "message.text" = "/c1" } }]

[[router.handler]]
id = "h1"
event = "message"
filters = [{ kind = "command", commands = ["c1"] }]

[[router.handler]]
id = "h2"
event = "message"
filters = [{ kind = "text_eq", value = "hello" }]

[[event]]
name = "first"
update = "update.text.small"
expect = "h1"
