# Five sibling routers under the root, six handlers each, Command and text == alternating (13 §1).
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"

[[router.handler]]
id = "h0"
event = "message"
filters = [{ kind = "command", commands = ["c0"] }]

