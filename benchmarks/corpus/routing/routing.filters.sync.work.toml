# D34: a sync filter doing work runs in a thread in 3.x (inline in 4.0); the sync handler stays in a
# thread in both. The `threads` probe records on_loop per component.
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router.handler]]
id = "h1"
event = "message"
sync = true
filters = [
    { id = "h1.f0", kind = "sync", result = true, work = 10000 },
    { id = "h1.f1", kind = "async", result = true },
]

[[event]]
name = "first"
update = "update.text.small"
expect = "h1"
