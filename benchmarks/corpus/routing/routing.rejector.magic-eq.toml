# Breaking change 13: a user filter placed before a certainly-false `F.text == literal`.
schema = 1
bench = false  # an oracle scenario (A-10), not a bench topology

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router.handler]]
id = "h1"
event = "message"
filters = [{ id = "h1.f0", kind = "sync", result = true }, { kind = "text_eq", value = "nope" }]

[[router.handler]]
id = "h2"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "h2"
