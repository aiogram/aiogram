# Router outer middleware short-circuits: its value is the result and later routers are not visited.
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"
outer_middlewares = [{ id = "r1.m0", event = "message", kind = "short_circuit", value = "short" }]

[[router.handler]]
id = "h1"
event = "message"
filters = []

[[router]]
name = "r2"
parent = "dp"

[[router.handler]]
id = "h2"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "short"
