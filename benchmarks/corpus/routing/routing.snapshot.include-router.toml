# D114: r1's outer middleware includes a new router r3 into dp while handling the first update.
# 3.x visits r3 in the same update (dp is still iterating its sub-routers); 4.0 from the next one.
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"

[[router.outer_middlewares]]
id = "r1.m0"
event = "message"
kind = "register"

[router.outer_middlewares.register]
id = "late.r3"
what = "router"

[router.outer_middlewares.register.router]
name = "r3"
parent = "dp"
handler = [{ id = "h3", event = "message", filters = [] }]

[[router.handler]]
id = "h1"
event = "message"
filters = [{ kind = "text_eq", value = "nope" }]

[[router]]
name = "r2"
parent = "dp"

[[router.handler]]
id = "h2"
event = "message"
filters = [{ kind = "text_eq", value = "nope" }]

[[event]]
name = "first"
update = "update.text.small"
expect = "h3"

[[event]]
name = "second"
update = "update.text.small"
patch = { update_id = 10002, "message.message_id" = 2 }
expect = "h3"
