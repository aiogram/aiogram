# D111 / PD-19: outer middlewares of routers without a matching handler. r1's only candidate is
# rejected by `F.text ==` (a compiled rejector in 4.0); r2's survives the rejectors and fails a user
# filter, so 4.0 still enters r2; r3 handles the update.
schema = 1
bench = false  # an oracle scenario (A-10), not a bench topology

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"
outer_middlewares = [{ id = "r1.m0", event = "message", kind = "pass" }]

[[router.handler]]
id = "h1"
event = "message"
filters = [{ kind = "text_eq", value = "nope" }]

[[router]]
name = "r2"
parent = "dp"
outer_middlewares = [{ id = "r2.m0", event = "message", kind = "pass" }]

[[router.handler]]
id = "h2"
event = "message"
filters = [{ id = "h2.f0", kind = "async", result = false }]

[[router]]
name = "r3"
parent = "dp"
outer_middlewares = [{ id = "r3.m0", event = "message", kind = "pass" }]

[[router.handler]]
id = "h3"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "h3"
