# Codex §11 R09 probe 1: a candidate's filter returns data, then its next filter rejects; the next
# candidate does not see that data. Real Router.message observer.
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"

[[router.handler]]
id = "h1"
event = "message"
filters = [
    { id = "h1.f0", kind = "data", returns = { db = "h1.f0" } },
    { id = "h1.f1", kind = "async", result = false },
]

[[router.handler]]
id = "h2"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "h2"
