# Codex §11 R09 probe 2: all filters pass and return data, the handler raises SkipHandler; the next
# candidate sees the filter data.
schema = 1

[variants]
fsm = ["on", "off"]

[[router]]
name = "dp"

[[router]]
name = "r1"
parent = "dp"

[[router.handler]]
id = "h1"
event = "message"
filters = [{ id = "h1.f0", kind = "data", returns = { db = "h1.f0" } }]
action = { kind = "skip" }

[[router.handler]]
id = "h2"
event = "message"
filters = []

[[event]]
name = "first"
update = "update.text.small"
expect = "h2"
