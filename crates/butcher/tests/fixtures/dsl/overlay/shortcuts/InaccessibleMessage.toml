# InaccessibleMessage: every 3.x shortcut of .butcher/types/InaccessibleMessage/aliases.yml, in the fill-DSL

[answer]
method = "sendMessage"
require = [{ path = "self.chat", message = "This method can be used only if chat is present in the message." }]
[answer.fill]
chat_id = "self.chat.id"

[reply]
method = "sendMessage"
require = [{ path = "self.chat", message = "This method can be used only if chat is present in the message." }]
ignore = ["reply_to_message_id"]
[reply.fill]
chat_id = "self.chat.id"
reply_parameters = "self.as_reply_parameters()"

