[pin]
method = "pinChatMessage"
require = [{ path = "self.chat", message = "This method can be used only if chat is present in the message." }]
[pin.fill]
chat_id = "self.chat.id"
message_id = "self.message_id"
business_connection_id = "self.business_connection_id"

[unpin]
method = "unpinChatMessage"
require = [{ path = "self.chat", message = "This method can be used only if chat is present in the message." }]
[unpin.fill]
chat_id = "self.chat.id"
message_id = "self.message_id"
business_connection_id = "self.business_connection_id"

[react]
method = "setMessageReaction"
require = [{ path = "self.chat", message = "This method can be used only if chat is present in the message." }]
forbid = [{ path = "self.business_connection_id", message = "Reactions can't be set on business messages." }]
[react.fill]
chat_id = "self.chat.id"
message_id = "self.message_id"

[answer_guest_query]
method = "answerGuestQuery"
require = [{ path = "self.guest_query_id", message = "This method can be used only if `guest_query_id` is present in the message." }]
[answer_guest_query.fill]
guest_query_id = "self.guest_query_id"
