schema: spec-driven

context: |
  aiogram — asynchronous Telegram Bot API framework for Python >= 3.10.
  Base branch: dev-3.x. Tooling: uv, ruff, mypy, pytest, towncrier, butcher.

  Layers:
  - aiogram/types, aiogram/methods, aiogram/enums are GENERATED by `butcher`
    from `.butcher/**/*.yml`. Never hand-edit generated code or entity.json —
    change the generator inputs and regenerate.
  - aiogram/client — Bot, HTTP sessions, default bot properties, API server config.
  - aiogram/dispatcher — Router/Dispatcher, event observers, middlewares, flags.
  - aiogram/filters, aiogram/fsm, aiogram/webhook, aiogram/utils — framework features.

  Conventions:
  - Every user-visible change needs CHANGES/<issue-or-pr>.<category>.rst.
  - Tests live in tests/, mirroring package layout; 100% coverage is expected.
  - See AGENTS.md for the full contribution workflow.

rules:
  spec:
    - Describe observable framework behavior, not implementation details.
    - Reference public API names (classes, methods) that users actually import.
